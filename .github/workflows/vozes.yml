name: vozes
on:
  push:
    paths: ['vozes/run.txt']
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            vozes
            jobs/comoespana
      - name: dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper num2words
      - name: cortar
        run: mkdir -p /tmp/vo && python3 vozes/voz.py /tmp/vo 2>&1 | tee /tmp/vo/log.txt
      - name: entregar
        if: always()
        run: |
          git config --global user.name fabrica; git config --global user.email fabrica@users.noreply.github.com
          cd /tmp/vo && git init -q && B=out-comoespana_voz_$(sed -n 1p $GITHUB_WORKSPACE/vozes/run.txt); git checkout -q -b $B
          git add -A && git commit -qm voz && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" $B
