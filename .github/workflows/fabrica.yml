name: fabrica
on:
  push:
    paths: ['jobs/*/job.json']
  workflow_dispatch:
    inputs:
      job:
        description: 'id del trabajo (carpeta en jobs/)'
        required: true
permissions:
  contents: write
concurrency:
  group: fabrica-${{ github.ref }}
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.job.outputs.id }}
      parts: ${{ steps.job.outputs.parts }}
      list: ${{ steps.job.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: qué trabajo
        id: job
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then J="${{ github.event.inputs.job }}";
          else J=$(git diff --name-only HEAD~1 HEAD | grep -m1 '^jobs/.*/job.json$' | cut -d/ -f2); fi
          P=$(python3 -c "import json;j=json.load(open('jobs/$J/job.json'));print(j.get('parts',1) if j.get('stage')!='cast' else 1)")
          L=$(python3 -c "print(list(range($P)))")
          echo "id=$J" >> $GITHUB_OUTPUT; echo "parts=$P" >> $GITHUB_OUTPUT; echo "list=$L" >> $GITHUB_OUTPUT
          echo "trabajo: $J · partes: $P"

  render:
    needs: setup
    if: needs.setup.outputs.parts != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.setup.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - name: caché de material
        uses: actions/cache@v4
        with:
          path: /tmp/fabrica_cache
          key: fabrica-cache-${{ github.run_id }}-p${{ matrix.part }}
          restore-keys: fabrica-cache-
      - name: dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q librosa soundfile numpy pillow opencv-python-headless
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers
      - name: fabricar parte
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          FABRICA_THREADS: '2'
          FABRICA_PART: ${{ matrix.part }}/${{ needs.setup.outputs.parts }}
        run: python3 fabrica/engine.py jobs/${{ needs.setup.outputs.id }} 2>&1 | tee /tmp/run_p${{ matrix.part }}.log; exit ${PIPESTATUS[0]}
      - name: subir planos
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.part }}
          path: |
            /tmp/fabrica_work/shots/*.mp4
            !/tmp/fabrica_work/shots/*.*.mp4
          retention-days: 2
          compression-level: 0

  assemble:
    needs: [setup, render]
    if: ${{ !cancelled() && (needs.render.result == 'success' || needs.render.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: caché de material
        uses: actions/cache@v4
        with:
          path: /tmp/fabrica_cache
          key: fabrica-cache-${{ github.run_id }}
          restore-keys: fabrica-cache-
      - name: planos de las partes
        if: needs.setup.outputs.parts != '1'
        uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          merge-multiple: true
          path: /tmp/fabrica_work/shots
      - name: dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q librosa soundfile numpy pillow opencv-python-headless
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers
      - name: fabricar
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          FABRICA_THREADS: '2'
        run: ls /tmp/fabrica_work/shots 2>/dev/null | wc -l; python3 fabrica/engine.py jobs/${{ needs.setup.outputs.id }} 2>&1 | tee /tmp/run.log; exit ${PIPESTATUS[0]}
      - name: entregar
        if: always()
        run: |
          J=${{ needs.setup.outputs.id }}; O=jobs/$J/out; mkdir -p $O
          git config --global user.name fabrica; git config --global user.email fabrica@users.noreply.github.com
          mkdir /tmp/r && cd /tmp/r && git init -q && git checkout -q -b out-$J
          cp $GITHUB_WORKSPACE/$O/* . 2>/dev/null || true; cp /tmp/run.log . 2>/dev/null || true
          if [ -f $J.mp4 ]; then split -b 90M -d $J.mp4 $J.mp4.part; rm $J.mp4; fi
          git add -A; git commit -qm "salida $J"
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} out-$J
