name: bajar
on:
  push:
    branches: ['e29n-v8']
    paths: ['bajar/**']
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: descargar
        run: |
          mkdir -p /tmp/m
          while read n u; do [ -z "$n" ] && continue; curl -fsSL --retry 3 -o /tmp/m/$n.mp3 "$u" && echo "ok $n $(stat -c%s /tmp/m/$n.mp3)"; done < bajar/voces.txt
      - name: publicar
        run: |
          cd /tmp/m && git init -q && git checkout -q -b out-e29n-v8-media
          git config user.name fabrica && git config user.email fabrica@users.noreply.github.com
          git add . && git commit -qm "voces e29n intro+p1"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} out-e29n-v8-media
