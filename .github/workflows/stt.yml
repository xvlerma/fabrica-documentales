name: stt
on:
  push:
    paths: ['stt/run.txt']
permissions:
  contents: write
jobs:
  stt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper
      - name: transcribir
        run: |
          mkdir -p /tmp/stt_out; D=$(head -1 stt/run.txt)
          if [ "$D" = "hls" ]; then python3 stt/hls.py stt/hls.json /tmp/hls; D=/tmp/hls; mkdir -p /tmp/stt_out; cp /tmp/hls/*.mp4 /tmp/stt_out/ 2>/dev/null; fi
          python3 stt/stt.py "$D" /tmp/stt_out 2>&1 | tee /tmp/stt_out/log.txt || true
      - name: entregar
        if: always()
        run: |
          git config --global user.name fabrica; git config --global user.email fabrica@users.noreply.github.com
          mkdir /tmp/r && cd /tmp/r && git init -q && git checkout -q -b out-e29n90_stt
          cp /tmp/stt_out/* . 2>/dev/null || true
          git add -A && git commit -qm "stt" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" out-e29n90_stt
