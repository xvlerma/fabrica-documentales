name: hls
on:
  push:
    paths: ['stt/hls_run.txt']
permissions:
  contents: write
jobs:
  corte:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        name: [h16_me_equivoque, h17_politico_limpio, h17b_continuar, h15f_no_financiado, h10_urda]
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper
      - run: python3 stt/hls1.py ${{ matrix.name }} /tmp/o 2>&1 | tee /tmp/o.log
      - if: always()
        run: |
          git config --global user.name fabrica; git config --global user.email fabrica@users.noreply.github.com
          mkdir -p /tmp/o; cp /tmp/o.log /tmp/o/ 2>/dev/null; cd /tmp/o && git init -q && B=out-hls-${{ matrix.name }}; git checkout -q -b $B
          git add -A && git commit -qm hls && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" $B
