name: stt3
on:
  push:
    branches: ['aq-media']
    paths: ['stt3/**']
permissions:
  contents: write
jobs:
  stt:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q 'faster-whisper==1.1.1' 'av==12.3.0' requests
      - name: transcribir
        run: |
          mkdir -p /tmp/o
          python3 - <<'PY'
          import json,os
          from faster_whisper import WhisperModel
          f='stt3/part${{ matrix.part }}.mp3'
          m=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          segs,_=m.transcribe(f,language='es',word_timestamps=True,beam_size=5,vad_filter=False,condition_on_previous_text=False)
          out=[{'a':s.start,'b':s.end,'t':s.text,'w':[[w.start,w.end,w.word] for w in s.words]} for s in segs]
          json.dump(out,open('/tmp/o/part${{ matrix.part }}.json','w'),ensure_ascii=False)
          PY
      - name: publicar
        if: always()
        run: |
          mkdir -p /tmp/o && cd /tmp/o && git init -q && git checkout -q -b out-aq-stt3-p${{ matrix.part }}
          git config user.name fabrica && git config user.email fabrica@users.noreply.github.com
          git add . && git commit -qm "stt3" && git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} out-aq-stt3-p${{ matrix.part }}
