name: probe
on: { push: { paths: ['.github/workflows/probe.yml'] }, workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: check apis
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
        run: |
          nproc; free -g | head -2; ffmpeg -version | head -1 || true
          echo pixabay $(curl -s "https://pixabay.com/api/videos/?key=$PIXABAY_API_KEY&q=luxor+egypt&per_page=3" | python3 -c "import sys,json;print(json.load(sys.stdin)['totalHits'])")
          echo freesound $(curl -s "https://freesound.org/apiv2/search/text/?query=footsteps+stone&token=$FREESOUND_API_KEY" | python3 -c "import sys,json;print(json.load(sys.stdin)['count'])")
          echo europeana $(curl -s "https://api.europeana.eu/record/v2/search.json?wskey=$EUROPEANA_API_KEY&query=egypt&qf=TYPE:VIDEO&reusability=open&rows=1" | python3 -c "import sys,json;print(json.load(sys.stdin).get('totalResults'))")
          echo met $(curl -s "https://collectionapi.metmuseum.org/public/collection/v1/search?hasImages=true&q=Ramesses" | python3 -c "import sys,json;print(json.load(sys.stdin)['total'])")
          echo commons $(curl -s -A "fabrica/1.0" "https://commons.wikimedia.org/w/api.php?action=query&format=json&list=search&srnamespace=6&srsearch=Medinet+Habu+filetype:video" | python3 -c "import sys,json;print(json.load(sys.stdin)['query']['searchinfo']['totalhits'])")
          echo archive $(curl -s "https://archive.org/advancedsearch.php?q=egypt+AND+mediatype:movies+AND+year:[1900+TO+1950]&fl[]=identifier&rows=1&output=json" | python3 -c "import sys,json;print(json.load(sys.stdin)['response']['numFound'])")
          echo cleveland $(curl -s "https://openaccess-api.clevelandart.org/api/artworks/?q=egypt&cc0=1&has_image=1&limit=1" | python3 -c "import sys,json;print(json.load(sys.stdin)['info']['total'])")
          echo openverse $(curl -s -A "fabrica/1.0" "https://api.openverse.org/v1/audio/?q=epic+cinematic&license_type=commercial&category=music" | python3 -c "import sys,json;print(json.load(sys.stdin)['result_count'])")
